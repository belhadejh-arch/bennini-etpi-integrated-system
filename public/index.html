<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <style id="app-viewport-reset">
      *, *::before, *::after { box-sizing: border-box; }
      :root { --app-css-viewport-height: 100vh; }
      @supports (height: 100dvh) {
        :root { --app-css-viewport-height: 100dvh; }
      }
      html, body {
        width: 100%;
        height: 100%;
        min-width: 0;
        margin: 0;
        padding: 0;
      }
      /* Keep genuine overflow reachable, rather than masking it on the body.
         Each screen's React Native ScrollView owns its content scrolling. */
      body { overflow: auto; }
      #root {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: var(--app-viewport-height, var(--app-css-viewport-height));
        min-width: 0;
        min-height: 0;
      }
    </style>
    <script src="/app-viewport.js"></script>
  </head>
  <body>
    <noscript>يجب تفعيل JavaScript لتشغيل المنصة.</noscript>
    <div id="root"></div>
  </body>
</html>
